<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>All entities portal</title>
    <link rel="stylesheet" href="/style.css" />
  </head>
  <body>
    <div id="root" class="gbif"></div>
    <script type="module">
      import { render, languages } from '/gbif-lib.js';

      // Every dataRoutes page is enabled, so links between entities stay on this site.
      render(document.getElementById('root'), {
        version: 3,
        pages: [
          'occurrenceSearch',
          'occurrenceKey',
          'datasetSearch',
          'datasetKey',
          'publisherSearch',
          'publisherKey',
          'taxonSearch',
          'taxonKey',
          'collectionSearch',
          'collectionKey',
          'institutionSearch',
          'institutionKey',
          'literatureSearch',
          'installationKey',
          'networkKey',
          'downloadKey',
          'countryKey',
          'participantKey',
          'nodeKey',
        ].map((id) => ({ id })),
        languages: languages.filter((l) => ['en', 'es'].includes(l.code)),
      });
    </script>
  </body>
</html>
