<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Full portal</title>
    <link rel="stylesheet" href="/style.css" />
  </head>
  <body>
    <div id="root" class="gbif"></div>
    <script type="module">
      import { render, languages } from '/gbif-lib.js';

      // Every page a portal may enable: occurrences (and their downloads), datasets, publishers,
      // collections, institutions and literature. Portals never enable taxon, participant,
      // country, network or article pages.
      render(document.getElementById('root'), {
        version: 3,
        pages: [
          'occurrenceSearch',
          'occurrenceKey',
          'downloadKey',
          'datasetSearch',
          'datasetKey',
          'publisherSearch',
          'publisherKey',
          'collectionSearch',
          'collectionKey',
          'institutionSearch',
          'institutionKey',
          'literatureSearch',
        ].map((id) => ({ id })),
        languages: languages.filter((l) => ['en', 'es'].includes(l.code)),
      });
    </script>
  </body>
</html>
