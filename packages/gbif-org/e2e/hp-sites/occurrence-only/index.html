<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Occurrence-only portal</title>
    <link rel="stylesheet" href="/style.css" />
  </head>
  <body>
    <div id="root" class="gbif"></div>
    <script type="module">
      import { render, languages } from '/gbif-lib.js';

      // The most minimal portal: only occurrence search. Links to anything else fall back to gbif.org.
      render(document.getElementById('root'), {
        version: 3,
        pages: [{ id: 'occurrenceSearch' }],
        occurrenceSearch: { scope: { type: 'equals', key: 'countryCode', value: 'DK' } },
        languages: languages.filter((l) => l.code === 'en'),
      });
    </script>
  </body>
</html>
